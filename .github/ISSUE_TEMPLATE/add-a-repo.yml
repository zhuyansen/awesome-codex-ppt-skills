name: Add a repo
description: Suggest an open-source slide or PPT skill for coding agents
title: "Add: owner/repo"
labels: ["submission"]
body:
  - type: input
    id: url
    attributes:
      label: GitHub URL
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of slides does it make?
      options:
        - Frameworks & toolkits
        - Editable PPTX
        - Image-first decks
        - Web slides
        - Business & consulting
        - Docs to slides
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Anything the README does not say
      description: Optional. The review reads the README, so the best way to get listed is a README that shows the result.
